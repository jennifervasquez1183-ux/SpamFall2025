<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SunflowerValley – Shop</title>

  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Pacifico&display=swap" rel="stylesheet">
</head>
<body>

<header>
  <nav class="navbar">
    <h1 class="logo">SunflowerValley</h1>
    <button class="menu-toggle">☰</button>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="shop.html" class="active">Shop</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>
</header>

<main>
  <h2 class="page-title">Shop Our Handmade Products</h2>

  <section class="products-grid">
    <div class="product">
      <img src="images/tote1.jpg" alt="Sunflower Tote">
      <h3>Sunflower Tote</h3>
      <p>$25</p>
      <button class="add-cart">Add to Cart</button>
    </div>

    <div class="product">
      <img src="images/lot.jpg" alt="Custom Tote">
      <h3>Custom Tote</h3>
      <p>$30</p>
      <button class="add-cart">Add to Cart</button>
    </div>

    <div class="product">
      <img src="images/prf.jpg" alt="Small Tote">
      <h3>Small Tote</h3>
      <p>$8</p>
      <button class="add-cart">Add to Cart</button>
    </div>

    <div class="product">
      <img src="images/roberto.jpg" alt="Sunflower Keychain">
      <h3>Sunflower Keychain</h3>
      <p>$8</p>
      <button class="add-cart">Add to Cart</button>
    </div>
  </section>

  <section class="canvas-preview">
    <h3>Preview Your Tote</h3>
    <div class="iframe-container">
      <iframe
        src="https://editor.p5js.org/jennifervasquez22/embed/Tq9owvfxh"
        frameborder="0"
        allowfullscreen
      ></iframe>
    </div>
  </section>
</main>

<footer>
  <p>© 2025 SunflowerValley</p>
  <p>Created by Jennifer Vasquez</p>
  <p>Sources: Google Fonts</p>
</footer>

<script src="js/sketch.js"></script>
<script src="js/script.js"></script>
</body>
</html>
