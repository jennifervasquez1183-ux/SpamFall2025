<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transformation</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <h1>Butterfly Transformation</h1>
  <nav class="flex-nav">
    <ul>
      <li><a href="index.html">Home - Me & Videos</a></li>
      <li><a href="image.html">Gallery</a></li>
      <li><a href="animation.html" class="active">Transformation</a></li>
      <li><a href="movement.html">Movement</a></li>
    </ul>
  </nav>
</header>
<main class="grid-layout">
  <section>
    <h2>The Beginning</h2>
    <p id="typewriter"></p>
  </section>
  <section>
    <img src="Gallery/nathan-dumlao-mNLymMqX7iE-unsplash.jpg" alt="Butterfly emerging" id="moveImg" style="cursor:pointer;">
  </section>
</main>
<footer>
  <p>Created by Jennifer Vasquez — Aspiring Professor</p>
</footer>
<script>
const fullText = "They call her fragile. Like a butterfly. They have never seen how far a butterfly flies to get home. The butterfly is a woman who has worked, migrated, and transformed. She starts as a caterpillar — invisible labor, hands that clean, cook and care.";
let idx=0;
function typeWriter(){
  if(idx<fullText.length){
    document.getElementById("typewriter").innerHTML += fullText.charAt(idx);
    idx++; setTimeout(typeWriter,35);
  }
}
typeWriter();
document.addEventListener('mousemove',(e)=>{
  const img=document.getElementById('moveImg');
  const x=(e.clientX/window.innerWidth-0.5)*30;
  const y=(e.clientY/window.innerHeight-0.5)*20;
  img.style.transform='translate('+x+'px,'+y+'px)';
});
document.getElementById('moveImg').onclick=function(){this.style.transform=this.style.transform.includes('scale(1.5)')?'':'translate(0,0) scale(1.5)';};
</script>
</body>
</html>
